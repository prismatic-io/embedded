version: 2
updates:
  # Roll all non-security version bumps into a single weekly PR. Security
  # updates are not affected by version-update groups and continue to open
  # individually so CVEs stay visible.
  # Bun manages the packages/* workspaces through the root bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Biome bumps require updating the $schema URL in biome.json files,
      # which dependabot doesn't do. Bump manually.
      - dependency-name: "@biomejs/biome"
      # Keep @types/node aligned with the Node runtime pinned in mise.toml.
      # Bump the major manually when the Node version changes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 does not yet expose the compiler API used by this project.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @mswjs/http-middleware still uses handleRequest, removed in MSW 3.
      - dependency-name: "msw"
        update-types: ["version-update:semver-major"]

  # The example apps are separate Bun projects with their own bun.lock, outside
  # the root workspaces.
  - package-ecosystem: "bun"
    directory: "/examples/example-embedded-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # See the root entry: the biome.json $schema URL must be bumped manually.
      - dependency-name: "@biomejs/biome"

  - package-ecosystem: "bun"
    directory: "/examples/angular-app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # @angular/compiler-cli pins TypeScript to one minor (>=6.0 <6.1).
      # Bump TypeScript only alongside Angular itself.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Angular majors need `ng update` migrations. Run it by hand.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      all-actions:
        patterns:
          - "*"
