name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      embedded: ${{ steps.changes.outputs.embedded }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            embedded:
              - 'packages/embedded/**'
              - 'examples/example-embedded-app/**'
              - 'bun.lock'
              - 'package.json'
              - 'mise.toml'
              - 'biome.json'
              - '.github/workflows/ci.yml'

  validate:
    needs: changes
    if: needs.changes.outputs.embedded == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.2.5
      - run: mise run install
      - run: npm --prefix examples/example-embedded-app ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - run: mise run validate
      - continue-on-error: true
        run: mise run agadoo
