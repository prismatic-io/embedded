name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Detect browser test changes
        id: browser
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A new branch has no previous commit; run the full suite in that case.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          changed=false
          while IFS= read -r path; do
            case "$path" in
              packages/embedded/*|bun.lock|package.json|mise.toml|biome.json|.github/workflows/ci.yml)
                changed=true
                break
                ;;
            esac
          done <<< "$changed_files"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v4.2.5
      - run: mise run install
      - run: npm --prefix examples/example-embedded-app ci
      - name: Cache Playwright browsers
        if: steps.browser.outputs.changed == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        if: steps.browser.outputs.changed == 'true'
        run: bunx playwright install --with-deps chromium
      - run: mise run validate
        env:
          MISE_TASK_SKIP: ${{ steps.browser.outputs.changed != 'true' && 'test:browser' || '' }}
      - continue-on-error: true
        run: mise run agadoo
